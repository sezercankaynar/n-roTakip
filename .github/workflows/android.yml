name: Android APK

on:
  push:
    branches: [claude/peaceful-gates-yhij2y, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: APK oluştur
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Sürüm adını belirle
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk NoroCep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoroCep-apk
          path: NoroCep.apk

      - name: GitHub Releases'a yükle
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NöroCep ${{ steps.version.outputs.tag }}
          body: |
            Telefona kurmak için aşağıdaki **NoroCep.apk** dosyasını indirin.
            Kurulum adımları: README.md
          files: NoroCep.apk
          make_latest: true

  # Derlenen APK'yı sanal bir Android telefonda açıp ana ekranın geldiğini doğrular.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoroCep-apk

      - name: KVM'i etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sanal telefonda aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r NoroCep.apk
            adb logcat -c
            adb shell am start -n com.sezercankaynar.norocep/.MainActivity
            sleep 30
            adb exec-out screencap -p > screen.png
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb shell cat /sdcard/ui.xml > ui.xml || true
            echo "===== LOGCAT ====="
            adb logcat -d | grep -iE "flutter|AndroidRuntime|FATAL|norocep|dart|jni" | tail -300
            echo "===== EKRAN METNİ ====="
            grep -o 'text="[^"]*"' ui.xml | head -40 || true
            grep -q "Sağlık profesyoneliyim" ui.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-ekran
          path: |
            screen.png
            ui.xml
